name: Deploy Firebase backend

on:
  workflow_dispatch:
    inputs:
      target:
        description: Backend components to deploy
        required: true
        default: firestore
        type: choice
        options:
          - firestore
          - full

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: zetema-4853d
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy selected backend components
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          if [ "$DEPLOY_TARGET" = "firestore" ]; then
            ONLY="firestore:rules,firestore:indexes"
          else
            ONLY="functions,firestore:rules,firestore:indexes"
          fi

          npx --yes firebase-tools@15.21.0 deploy \
            --project zetema-4853d \
            --only "$ONLY" \
            --non-interactive
