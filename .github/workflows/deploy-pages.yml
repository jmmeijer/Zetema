name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --dir apps/web build
        env:
          VITE_APP_BASE_PATH: /Zetema/
          VITE_FIREBASE_API_KEY: AIzaSyAY4nPo3N-eD8U1mOO85VzIsZ25b_CdIiA
          VITE_FIREBASE_AUTH_DOMAIN: zetema-4853d.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: zetema-4853d
          VITE_FIREBASE_STORAGE_BUCKET: zetema-4853d.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "200132502547"
          VITE_FIREBASE_APP_ID: 1:200132502547:web:8f05dfddd34d37d8520be6
          VITE_FIREBASE_FUNCTIONS_REGION: us-central1
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_FIREBASE_APPCHECK_DEBUG: "false"
          VITE_FIREBASE_USE_EMULATORS: "false"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
