name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm ci

      - name: Build web app with Pages configuration
        run: pnpm --dir apps/web build
        env:
          VITE_BASE_PATH: /Zetema/
          VITE_FIREBASE_API_KEY: AIzaSyAY4nPo3N-eD8U1mOO85VzIsZ25b_CdIiA
          VITE_FIREBASE_AUTH_DOMAIN: zetema-4853d.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: zetema-4853d
          VITE_FIREBASE_STORAGE_BUCKET: zetema-4853d.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "200132502547"
          VITE_FIREBASE_APP_ID: 1:200132502547:web:8f05dfddd34d37d8520be6
          VITE_FIREBASE_FUNCTIONS_REGION: europe-west4
          VITE_FIREBASE_APPCHECK_SITE_KEY: ci-placeholder-site-key
          VITE_FIREBASE_APPCHECK_DEBUG: "false"
          VITE_FIREBASE_USE_EMULATORS: "false"

  firebase-emulator:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Functions for emulator
        run: pnpm --dir apps/functions run build

      - name: Run Firebase emulator smoke test
        env:
          FUNCTIONS_EMULATOR: "true"
        run: >-
          npx --yes firebase-tools@15.21.0 emulators:exec
          --config firebase.emulator.json
          --project demo-zetema
          --only auth,firestore,functions
          "node apps/web/scripts/firebase-emulator-smoke.mjs"
