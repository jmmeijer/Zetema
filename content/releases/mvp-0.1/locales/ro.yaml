theme.nature-of-god.title: Natura lui Dumnezeu
theme.nature-of-god.description: Întrebări despre cum este Dumnezeu și ce atribute crezi că are.
question.god-exists.prompt: Crezi că Dumnezeu există?
question.existence-confidence.prompt: Cât de sigur(ă) ești de răspunsul tău la întrebarea dacă Dumnezeu există?
